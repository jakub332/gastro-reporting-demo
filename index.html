<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gastro Reporting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light dark;--bg:#f4f3ee;--surface:#fdfdfb;--ink:#17170f;--ink-2:#55534c;--line:#c6c3b8;--accent:#b8650e;--crit:#a32a2a}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--surface:#1a1a19;--ink:#f0efec;--ink-2:#c3c2b7;--line:#3c3c39;--accent:#e2963a;--crit:#e66767}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:380px;width:100%;display:grid;gap:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.brand i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;font-style:normal;font-size:14px}
p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.45}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
button{font:inherit;font-weight:600;padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.err{color:var(--crit);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form class="box" id="f">
  <div class="brand"><i>G</i>Gastro Reporting</div>
  <p>Soukromé demo. Zadej přístupový kód, nebo použij odkaz, který jsi dostal.</p>
  <input type="password" id="p" placeholder="Přístupový kód" autocomplete="current-password" autofocus>
  <button type="submit">Otevřít demo</button>
  <div class="err" id="e"></div>
</form>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(SALT), iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(IV)}, key, u8(CT));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}

});
